appId: lol.draftedge.desktop
productName: DraftEdge
copyright: DraftEdge
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
artifactName: DraftEdge-${version}-${os}-${arch}.${ext}

# Canal de distribution et d'auto-update : GitHub Releases du repo (public)
publish:
  provider: github
  owner: axelvuillaume
  repo: DraftEdge
  releaseType: release

mac:
  category: public.app-category.utilities
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Sans certificat Apple Developer, electron-builder applique une signature ad hoc (CSC_IDENTITY_AUTO_DISCOVERY=false).
  # Évite le message « endommagé » de Gatekeeper : l'utilisateur peut ouvrir via clic droit → Ouvrir / Réglages > Confidentialité.
  # Avec un compte Apple Developer : fournir CSC_LINK / CSC_KEY_PASSWORD + APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # dans les secrets GitHub, et passer notarize à true.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    # Package MSIX pour le Microsoft Store : non signé ici, c'est le Store qui le signe après certification
    # (aucun SmartScreen). À téléverser dans Partner Center (produit « DraftEdge », ID Store 9P062QMFFCQH).
    - target: appx
      arch: [x64]
  # Pas de certificat de signature pour l'instant
  signAndEditExecutable: false

# Identité fournie par Partner Center (Gestion des produits > Identité du produit). Doit correspondre exactement.
appx:
  identityName: Blade40.DraftEdge
  publisher: CN=3FD303F7-3C72-4793-A032-C39F2F9C7E1F
  publisherDisplayName: Blade40
  displayName: DraftEdge
  applicationId: DraftEdge
  backgroundColor: '#0f172a'
  languages: [fr-FR, en-US]
  showNameOnTiles: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: DraftEdge
  createDesktopShortcut: true

# Tuiles Store/Windows : resources/appx/*.png (StoreLogo, Square44x44Logo, Square150x150Logo, Wide310x150Logo,
# SmallTile, LargeTile, SplashScreen + variantes .scale-N et .targetsize-N). Sans ces fichiers electron-builder met
# ses images d'exemple, refusées à la certification Store (règle 10.1.1.11). Les variantes déclenchent makepri
# (build Windows uniquement). Régénération : voir scripts/appx-assets.py.
