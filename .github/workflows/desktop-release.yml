# Build et publication de l'app desktop sur GitHub Releases.
# Déclenchement : push d'un tag "desktop-vX.Y.Z" (la version doit correspondre à desktop/package.json).
# electron-builder crée/complète la release GitHub "vX.Y.Z" ; les copies "latest" y sont ajoutées ensuite.
name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Vérifier que le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#desktop-v}
          if [ "$PKG" != "$TAG" ]; then echo "package.json=$PKG mais tag=$TAG"; exit 1; fi

      - run: npm ci
      - run: npm run lint
      - run: npx electron-vite build

      # Signature Mac : sans certificat (secrets absents) → signature ad hoc. Avec certificat → Developer ID + notarisation.
      # Les variables ne sont exportées que si le secret existe : une chaîne vide ferait planter electron-builder ("not a file").
      - name: Préparer la signature
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "CSC_LINK=$CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
            echo "Certificat fourni : signature Developer ID"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "Pas de certificat : signature ad hoc"
          fi

      - name: Build et publier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      # Copies au nom stable pour les liens permanents du site (releases/latest/download/DraftEdge-latest-*).
      # Le .appx (Microsoft Store) est aussi publié sur la release par electron-builder : le récupérer là
      # pour le téléverser dans Partner Center, il n'est pas destiné au téléchargement direct.
      - name: Publier les installeurs "latest"
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p latest
          for f in dist/*.dmg dist/*.exe; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            stable=$(echo "$name" | sed -E 's/^DraftEdge-[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.]+)?-(mac|win|linux)-/DraftEdge-latest-\2-/')
            cp "$f" "latest/$stable"
          done
          ls latest
          # electron-builder publie sous le tag "v<version>" (pas "desktop-v<version>")
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$RELEASE_TAG" latest/* --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: draftedge-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.appx
